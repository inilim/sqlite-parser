name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Validate grammar
        run: composer grammar:check

      - name: Regenerate parser & verify no drift
        run: |
          composer grammar:build
          git diff --exit-code -- src/Parser/SqliteParser.php

      - name: Run tests
        run: composer tests

      - name: Run static analysis
        run: composer stan